<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Matafuegos a Google Sheets</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 480px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #d32f2f; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #d32f2f; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #b71c1c; }
    #status { margin-top: 15px; font-weight: bold; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
    .exito { background: #e8f5e9; color: #2e7d32; display: block !important; }
    .error { background: #ffebee; color: #c62828; display: block !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧯 Control de Matafuegos</h2>
    <p>Escaneá el QR o escribí el ID para guardar en Google Sheets</p>

    <!-- Escáner por Cámara -->
    <div id="reader"></div>

    <hr style="margin: 20px 0; border: 0.5px solid #eee;">

    <!-- Ingreso Manual por ID -->
    <input type="text" id="manualId" placeholder="Escribí el ID del matafuego (ej: 33134)" />
    <button onclick="guardarPorInputManual()">🚀 Registrar por ID</button>

    <div id="status"></div>
  </div>

  <script>
    // ⚠️ PEGA ACÁ LA URL QUE COPIASTE DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbyqeSvzXdVKvP535dfkjl8TUnqQfenbWprRahaxr-QILsS6IhzQ1NEWA-XVPuaqUMkq/exec
";

    // Función que envía los datos a la Hoja de Cálculo
    function enviarAGoogleSheets(idCapturado) {
      const statusDiv = document.getElementById("status");
      statusDiv.className = "";
      statusDiv.style.display = "block";
      statusDiv.innerText = "⏳ Guardando en Google Sheets...";

      const datosMatafuego = {
        idQr: idCapturado,
        numExtintor: idCapturado,
        agente: "Polvo Químico ABC",
        capacidad: "5 Kg",
        ubicacion: "Inspección General",
        estado: "OPERATIVO"
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datosMatafuego)
      })
      .then(() => {
        statusDiv.className = "exito";
        statusDiv.innerText = "✅ ¡Matafuego ID " + idCapturado + " guardado en Google Sheets!";
        document.getElementById("manualId").value = "";
      })
      .catch(err => {
        statusDiv.className = "error";
        statusDiv.innerText = "❌ Error al conectar con Google Sheets.";
      });
    }

    // Botón manual
    function guardarPorInputManual() {
      const id = document.getElementById("manualId").value.trim();
      if (id) {
        enviarAGoogleSheets(id);
      } else {
        alert("Por favor escribí un ID");
      }
    }

    // Inicio del Escáner QR
    function onScanSuccess(decodedText) {
      enviarAGoogleSheets(decodedText);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
